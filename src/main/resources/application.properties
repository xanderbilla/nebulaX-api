spring.application.name=nebulax
app.version=1.0.0

# API Configuration
app.api.version=v1
app.api.base-path=/api/${app.api.version}

# Default profile
spring.profiles.active=local

# AWS Configuration
aws.region=${AWS_REGION:us-east-1}

# CloudFront Configuration for video access links
app.cloudfront.base-url=${CLOUDFRONT_BASE_URL:https://d1234567890.cloudfront.net}

# Nebulax Application Configuration
app.video.supported-extensions=${VIDEO_SUPPORTED_EXTENSIONS:.mp4,.avi,.mov,.mkv,.wmv,.flv,.webm,.m4v,.3gp,.ts}

# DynamoDB Table Configuration
app.dynamodb.videos-table=${DYNAMODB_VIDEOS_TABLE:Videos}

# Error Handling Configuration
spring.web.resources.add-mappings=false
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=on-param
server.error.include-exception=false

# Logging Configuration
logging.level.com.example.demo=INFO
logging.level.software.amazon.awssdk=WARN
