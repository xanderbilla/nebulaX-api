# Local development profile
server.port=8080
server.servlet.context-path=

# Logging for development
logging.level.com.example.demo=DEBUG
logging.level.root=INFO
logging.level.software.amazon.awssdk=WARN
logging.level.com.example.demo.util.AuthLogger=INFO
logging.level.com.example.demo.service.impl.CognitoServiceImpl=INFO
logging.level.com.example.demo.controller.AuthController=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n

# Error handling for development
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true

# Enable detailed error responses
spring.web.resources.add-mappings=true

# Jackson configuration for pretty JSON
spring.jackson.serialization.indent-output=true

# CORS Configuration for local development - Hardcoded values from .env file
app.cors.allowed-origins=http://localhost:3000,http://localhost:3001,http://localhost:8080
app.cors.allowed-methods=GET,POST,PUT,DELETE,OPTIONS,PATCH
app.cors.allowed-headers=Authorization,Content-Type,X-Requested-With,Accept,Origin,Access-Control-Request-Method,Access-Control-Request-Headers
app.cors.exposed-headers=Access-Control-Allow-Origin,Access-Control-Allow-Credentials
app.cors.allow-credentials=true
app.cors.max-age=3600

# AWS Cognito Configuration - Using current deployed stack values
aws.cognito.client-id=293aksotvlffec95ife5hn6pfv
aws.cognito.client-secret=rova3aqcdtv121jtfdt35h7ijg7ctolaiei508g4atnjhbigbed
aws.cognito.user-pool-id=us-east-1_ARe0fTZri
aws.cognito.region=us-east-1

# Disable Parameter Store for local development
aws.ssm.enabled=false

# DynamoDB Local Configuration
aws.dynamodb.endpoint=http://localhost:8000
aws.dynamodb.table-name=Videos
aws.dynamodb.region=us-east-1
aws.dynamodb.access-key=dummy
aws.dynamodb.secret-key=dummy

# S3 Local Configuration (using LocalStack or MinIO)
aws.s3.endpoint=http://localhost:4566
aws.s3.bucket=${S3_VIDEOS_BUCKET:local-nebulax-s3}
aws.s3.region=us-east-1
aws.s3.access-key=test
aws.s3.secret-key=test

# Rate Limiting Configuration (more lenient for local) - Values from .env file
app.rate-limit.forgot-password.limit=5
app.rate-limit.forgot-password.window-seconds=3600
app.rate-limit.resend-confirmation.limit=3
app.rate-limit.resend-confirmation.window-seconds=3600

# Security Configuration - Values from .env file
app.security.suspicious-patterns=.*\\+.*@.*,.*[0-9]{10,}.*@.*
app.security.disposable-domains=10minutemail.com,tempmail.org,guerrillamail.com,mailinator.com,throwaway.email,temp-mail.org,yopmail.com,maildrop.cc,tempail.com