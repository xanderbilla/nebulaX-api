AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: Nebulax Application on AWS Lambda with S3 Media Processing

Parameters:
  Stage:
    Type: String
    Default: dev
    Description: Stage name for the deployment

Globals:
  Function:
    Timeout: 60
    MemorySize: 2048
    Runtime: java21

Resources:
  # DynamoDB Table for Videos
  VideosTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: !Sub "${AWS::StackName}-videos"
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: videoId
          AttributeType: S
      KeySchema:
        - AttributeName: videoId
          KeyType: HASH
      TimeToLiveSpecification:
        AttributeName: ttl
        Enabled: false
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Project
          Value: !Ref AWS::StackName

  # S3 Bucket for media uploads
  VideosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-s3-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - "http://localhost:*"
              - "https://localhost:*"
              - "http://127.0.0.1:*"
              - "https://127.0.0.1:*"
            ExposedHeaders:
              - ETag
              - x-amz-meta-custom-header
            MaxAge: 3600
      Tags:
        - Key: Project
          Value: !Ref AWS::StackName

  # S3 Bucket for transcoded videos
  TranscodedVideosBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub "${AWS::StackName}-transcoded-${AWS::AccountId}"
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      VersioningConfiguration:
        Status: Suspended
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      CorsConfiguration:
        CorsRules:
          - AllowedHeaders:
              - "*"
            AllowedMethods:
              - GET
              - PUT
              - POST
              - DELETE
              - HEAD
            AllowedOrigins:
              - "http://localhost:*"
              - "https://localhost:*"
              - "http://127.0.0.1:*"
              - "https://127.0.0.1:*"
            ExposedHeaders:
              - ETag
              - x-amz-meta-custom-header
            MaxAge: 3600
      Tags:
        - Key: Project
          Value: !Ref AWS::StackName

  # Origin Access Control for Videos Bucket CloudFront
  VideosBucketOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-videos-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: !Sub "OAC for ${AWS::StackName} videos bucket"

  # Origin Access Control for Transcoded Videos Bucket CloudFront
  TranscodedVideosBucketOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub "${AWS::StackName}-transcoded-oac"
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
        Description: !Sub "OAC for ${AWS::StackName} transcoded videos bucket"

  # Bucket Policy for Videos Bucket (allows CloudFront access)
  VideosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref VideosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub "${VideosBucket.Arn}/*"
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${VideosBucketCloudFrontDistribution}"

  # Bucket Policy for Transcoded Videos Bucket (allows CloudFront access)
  TranscodedVideosBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref TranscodedVideosBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCloudFrontServicePrincipal
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: 's3:GetObject'
            Resource: !Sub "${TranscodedVideosBucket.Arn}/*"
            Condition:
              StringEquals:
                'AWS:SourceArn': !Sub "arn:aws:cloudfront::${AWS::AccountId}:distribution/${TranscodedVideosBucketCloudFrontDistribution}"

  # CloudFront Distribution for Videos Bucket (Posters)
  VideosBucketCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "CloudFront distribution for ${AWS::StackName} videos bucket (posters)"
        Enabled: true
        DefaultRootObject: index.html
        Origins:
          - Id: !Sub "${VideosBucket}-origin"
            DomainName: !GetAtt VideosBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref VideosBucketOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: !Sub "${VideosBucket}-origin"
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: true
          DefaultTTL: 86400
          MaxTTL: 31536000
          MinTTL: 0
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref AWS::StackName

  # CloudFront Distribution for Transcoded Videos Bucket (Videos and Trailers)
  TranscodedVideosBucketCloudFrontDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "CloudFront distribution for ${AWS::StackName} transcoded videos bucket"
        Enabled: true
        Origins:
          - Id: !Sub "${TranscodedVideosBucket}-origin"
            DomainName: !GetAtt TranscodedVideosBucket.RegionalDomainName
            S3OriginConfig:
              OriginAccessIdentity: ""
            OriginAccessControlId: !Ref TranscodedVideosBucketOriginAccessControl
        DefaultCacheBehavior:
          TargetOriginId: !Sub "${TranscodedVideosBucket}-origin"
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods:
            - GET
            - HEAD
            - OPTIONS
          CachedMethods:
            - GET
            - HEAD
          ForwardedValues:
            QueryString: false
            Cookies:
              Forward: none
          Compress: false  # Don't compress video files
          DefaultTTL: 86400
          MaxTTL: 31536000
          MinTTL: 0
        # Additional cache behavior for HLS streaming files
        CacheBehaviors:
          - PathPattern: "*.m3u8"
            TargetOriginId: !Sub "${TranscodedVideosBucket}-origin"
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            Compress: false
            DefaultTTL: 300  # Shorter TTL for playlist files
            MaxTTL: 3600
            MinTTL: 0
          - PathPattern: "*.ts"
            TargetOriginId: !Sub "${TranscodedVideosBucket}-origin"
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods:
              - GET
              - HEAD
              - OPTIONS
            CachedMethods:
              - GET
              - HEAD
            ForwardedValues:
              QueryString: false
              Cookies:
                Forward: none
            Compress: false
            DefaultTTL: 86400  # Longer TTL for video segments
            MaxTTL: 31536000
            MinTTL: 0
        PriceClass: PriceClass_100
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - Key: Project
          Value: !Ref AWS::StackName

  # CloudWatch Log Group for Lambda Function
  DemoFunctionLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/lambda/${AWS::StackName}-func"
      RetentionInDays: 14

  # Main Lambda Function (SAM)
  DemoFunction:
    Type: AWS::Serverless::Function
    DependsOn: DemoFunctionLogGroup
    Properties:
      FunctionName: !Sub "${AWS::StackName}-func"
      CodeUri: target/demo-lambda.jar
      Handler: com.example.demo.handler.StreamLambdaHandler::handleRequest
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-func:*"
            - Effect: Allow
              Action:
                - dynamodb:PutItem
                - dynamodb:GetItem
                - dynamodb:UpdateItem
                - dynamodb:DeleteItem
                - dynamodb:Query
                - dynamodb:Scan
              Resource: !GetAtt VideosTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectMetadata
                - s3:HeadObject
                - s3:PutObject
                - s3:DeleteObject
                - s3:GetObjectVersion
                - s3:ListBucket
              Resource: 
                - !Sub "arn:aws:s3:::${VideosBucket}"
                - !Sub "arn:aws:s3:::${VideosBucket}/*"
                - !Sub "arn:aws:s3:::${TranscodedVideosBucket}"
                - !Sub "arn:aws:s3:::${TranscodedVideosBucket}/*"
      Environment:
        Variables:
          STAGE: !Ref Stage
          SPRING_PROFILES_ACTIVE: lambda
          DYNAMODB_VIDEOS_TABLE: !Ref VideosTable
          S3_VIDEOS_BUCKET: !Ref VideosBucket
          S3_TRANSCODED_BUCKET: !Ref TranscodedVideosBucket
          CLOUDFRONT_VIDEOS_BASE_URL: !Sub "https://${VideosBucketCloudFrontDistribution.DomainName}"
          CLOUDFRONT_TRANSCODED_BASE_URL: !Sub "https://${TranscodedVideosBucketCloudFrontDistribution.DomainName}"
      Events:
        HealthApi:
          Type: Api
          Properties:
            Path: /api/v1/health
            Method: get
            RestApiId: !Ref DemoApi
        ProxyApi:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
            RestApiId: !Ref DemoApi

  # API Gateway (SAM)
  DemoApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: !Sub "${AWS::StackName}-api"
      StageName: !Ref Stage
      Cors:
        AllowMethods: "'GET,POST,PUT,DELETE,OPTIONS'"
        AllowHeaders: "'Content-Type,X-Amz-Date,Authorization,X-Api-Key,X-Amz-Security-Token'"
        AllowOrigin: "'*'"
      AccessLogSetting:
        DestinationArn: !GetAtt ApiGatewayLogGroup.Arn
        Format: '{"requestId":"$context.requestId","requestTime":"$context.requestTime","httpMethod":"$context.httpMethod","path":"$context.path","status":$context.status,"responseLength":$context.responseLength,"responseTime":$context.responseTime,"xrayTraceId":"$context.xrayTraceId"}'

  # CloudWatch Log Group for API Gateway
  ApiGatewayLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/aws/apigateway/${AWS::StackName}-api"
      RetentionInDays: 14

  # MediaConvert IAM Role
  MediaConvertRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: mediaconvert.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: MediaConvertS3Access
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - s3:GetObject
                  - s3:GetObjectMetadata
                  - s3:PutObject
                  - s3:DeleteObject
                Resource:
                  - !Sub "arn:aws:s3:::${VideosBucket}/*"
                  - !Sub "arn:aws:s3:::${TranscodedVideosBucket}/*"
              - Effect: Allow
                Action:
                  - s3:ListBucket
                Resource:
                  - !Sub "arn:aws:s3:::${VideosBucket}"
                  - !Sub "arn:aws:s3:::${TranscodedVideosBucket}"

  # S3 Video Processor Lambda Function
  S3VideoProcessorFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-s3-processor"
      CodeUri: target/demo-lambda.jar
      Handler: com.example.demo.handler.S3VideoProcessorHandler::handleRequest
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-s3-processor:*"
            - Effect: Allow
              Action:
                - mediaconvert:CreateJob
                - mediaconvert:GetJob
                - mediaconvert:ListJobs
                - mediaconvert:DescribeEndpoints
              Resource: "*"
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:PutItem
                - dynamodb:GetItem
              Resource: !GetAtt VideosTable.Arn
            - Effect: Allow
              Action:
                - s3:GetObject
                - s3:GetObjectMetadata
                - s3:HeadObject
              Resource: 
                - !Sub "arn:aws:s3:::${VideosBucket}/*"
            - Effect: Allow
              Action:
                - iam:PassRole
              Resource: !GetAtt MediaConvertRole.Arn
      Environment:
        Variables:
          STAGE: !Ref Stage
          SPRING_PROFILES_ACTIVE: lambda
          DYNAMODB_VIDEOS_TABLE: !Ref VideosTable
          S3_VIDEOS_BUCKET: !Ref VideosBucket
          S3_TRANSCODED_BUCKET: !Ref TranscodedVideosBucket
          MEDIACONVERT_ROLE_ARN: !GetAtt MediaConvertRole.Arn
          CLOUDFRONT_VIDEOS_BASE_URL: !Sub "https://${VideosBucketCloudFrontDistribution.DomainName}"
          CLOUDFRONT_TRANSCODED_BASE_URL: !Sub "https://${TranscodedVideosBucketCloudFrontDistribution.DomainName}"

  # EventBridge Rule for MediaConvert Job State Changes
  MediaConvertEventRule:
    Type: AWS::Events::Rule
    Properties:
      Name: !Sub "${AWS::StackName}-mediaconvert-events"
      Description: "Capture MediaConvert job state changes"
      EventPattern:
        source:
          - "aws.mediaconvert"
        detail-type:
          - "MediaConvert Job State Change"
        detail:
          status:
            - "COMPLETE"
            - "ERROR"
      State: ENABLED
      Targets:
        - Arn: !GetAtt MediaConvertEventHandler.Arn
          Id: "MediaConvertEventTarget"

  # Lambda function to handle MediaConvert events
  MediaConvertEventHandler:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub "${AWS::StackName}-mediaconvert-handler"
      CodeUri: target/demo-lambda.jar
      Handler: com.example.demo.handler.MediaConvertEventHandler::handleRequest
      Policies:
        - Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: !Sub "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}-mediaconvert-handler:*"
            - Effect: Allow
              Action:
                - dynamodb:UpdateItem
                - dynamodb:GetItem
                - dynamodb:Query
                - dynamodb:Scan
                - dynamodb:PutItem
              Resource: !GetAtt VideosTable.Arn
            - Effect: Allow
              Action:
                - mediaconvert:GetJob
              Resource: "*"
      Environment:
        Variables:
          STAGE: !Ref Stage
          SPRING_PROFILES_ACTIVE: lambda
          DYNAMODB_VIDEOS_TABLE: !Ref VideosTable
          S3_TRANSCODED_BUCKET: !Ref TranscodedVideosBucket
          CLOUDFRONT_VIDEOS_BASE_URL: !Sub "https://${VideosBucketCloudFrontDistribution.DomainName}"
          CLOUDFRONT_TRANSCODED_BASE_URL: !Sub "https://${TranscodedVideosBucketCloudFrontDistribution.DomainName}"

  # Permission for EventBridge to invoke the Lambda function
  MediaConvertEventHandlerPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !GetAtt MediaConvertEventHandler.Arn
      Action: lambda:InvokeFunction
      Principal: events.amazonaws.com
      SourceArn: !GetAtt MediaConvertEventRule.Arn

  # Permission for S3 to invoke the S3VideoProcessorFunction
  S3VideoProcessorPermission:
    Type: AWS::Lambda::Permission
    Properties:
      FunctionName: !Ref S3VideoProcessorFunction
      Action: lambda:InvokeFunction
      Principal: s3.amazonaws.com
      SourceArn: !Sub "arn:aws:s3:::${VideosBucket}"

Outputs:
  # API Gateway URL
  DemoApiUrl:
    Description: "API Gateway endpoint URL"
    Value: !Sub "https://${DemoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/"
    Export:
      Name: !Sub "${AWS::StackName}-api-url"

  # S3 Bucket Name
  VideosBucketName:
    Description: "S3 bucket name for video uploads"
    Value: !Ref VideosBucket
    Export:
      Name: !Sub "${AWS::StackName}-videos-bucket"

  # S3 Bucket Name (legacy output)
  S3BucketName:
    Description: "S3 bucket name for video uploads (legacy)"
    Value: !Ref VideosBucket
    Export:
      Name: !Sub "${AWS::StackName}-s3-bucket"

  # Transcoded S3 Bucket Name
  TranscodedS3BucketName:
    Description: "S3 bucket name for transcoded videos"
    Value: !Ref TranscodedVideosBucket
    Export:
      Name: !Sub "${AWS::StackName}-transcoded-s3-bucket"

  # DynamoDB Table Name
  DynamoDBTableName:
    Description: "DynamoDB table name for videos"
    Value: !Ref VideosTable
    Export:
      Name: !Sub "${AWS::StackName}-dynamodb-table"

  # Lambda Function Name
  LambdaFunctionName:
    Description: "Lambda function name"
    Value: !Ref DemoFunction
    Export:
      Name: !Sub "${AWS::StackName}-lambda-function"

  # S3 Video Processor Function Name
  S3VideoProcessorFunctionName:
    Description: "S3 Video Processor Lambda function name"
    Value: !Ref S3VideoProcessorFunction
    Export:
      Name: !Sub "${AWS::StackName}-s3-processor-function"

  # MediaConvert Event Handler Function Name
  MediaConvertEventHandlerFunctionName:
    Description: "MediaConvert Event Handler Lambda function name"
    Value: !Ref MediaConvertEventHandler
    Export:
      Name: !Sub "${AWS::StackName}-mediaconvert-handler-function"

  # Health Endpoint
  HealthEndpoint:
    Description: "Health check endpoint URL"
    Value: !Sub "https://${DemoApi}.execute-api.${AWS::Region}.amazonaws.com/${Stage}/api/v1/health"
    Export:
      Name: !Sub "${AWS::StackName}-health-endpoint"

  # CloudFront Distribution for Videos Bucket (Posters)
  VideosBucketCloudFrontURL:
    Description: "CloudFront distribution URL for videos bucket (posters)"
    Value: !Sub "https://${VideosBucketCloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-videos-cloudfront-url"

  # CloudFront Distribution for Transcoded Videos Bucket
  TranscodedVideosBucketCloudFrontURL:
    Description: "CloudFront distribution URL for transcoded videos bucket"
    Value: !Sub "https://${TranscodedVideosBucketCloudFrontDistribution.DomainName}"
    Export:
      Name: !Sub "${AWS::StackName}-transcoded-cloudfront-url"
